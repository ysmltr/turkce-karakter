<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <title>Turkish Character Converter</title>
</head>
<body>
<div class="header">
    <h1>Turkish Converter</h1>
    <p class="subtitle">Type Turkish without the special letters — they're fixed automatically as you type.</p>
</div>

    <textarea id="input" placeholder="gunaydin, nasilsiniz, tesekkurler..."></textarea>

    <div class="output-wrap">
        <textarea id="output" placeholder="Converted text will appear here..." readonly></textarea>
        <button class="btn-copy" id="btn-kopya" title="Copy">Copy</button>
    </div>

    <script src="deasciifier.js"></script>
    <script src="popup.js"></script>
</body>
</html>
